# Single source of truth for every number and hard fact on the site (BRIEF §11.2).
# No value is ever typed into a component.
#
# Schema:
#   key / value / label / as_of / source / source_quote / verified
#
# verified: false
#   · real build  → renders NOTHING (not a placeholder — nothing)
#   · demo build  → renders with a dotted underline and a hover note naming
#                   what needs confirming, so the owner reviews the finished
#                   design and the outstanding-figures checklist in one pass
#
# STANDARD FOR verified: true — the client, or a client document, confirmed it.
# Consistency across the old site is NOT verification: the old site is
# consistently wrong about several things. Nothing below currently meets the
# standard, so every entry is verified: false pending client sign-off.

facts:
  # ---------------------------------------------------------------------
  # Identity facts. Asserted declaratively in BRIEF §2, which is the strongest
  # source we have — but the brief may itself have been written from the old
  # site, so none is independently confirmed. Demoted 2026-09-05 (see D-007).
  # ---------------------------------------------------------------------
  - key: founded
    value: 1997
    label: "Operating since"
    as_of: null
    source: "BRIEF.md §2 and §7.2; old site hero"
    source_quote: >
      BRIEF §2: "a nearshore supply-chain and logistics BPO headquartered in
      Mandeville, Jamaica, operating since 1997" / "Founded 1997".
      Audit: old site hero reads "BRIDGING THE GAP Since 1997".
      NOT independently confirmed — the brief may derive from the site.
    verified: false

  - key: phone
    value: "+17542738895"
    label: "Phone"
    as_of: null
    source: "BRIEF.md §2; audit of old site header"
    source_quote: >
      BRIEF §2: "Phone +1 754 273-8895". Audit: "The top bar is dark charcoal
      with phone (+1 754 273-8895)" and separately notes the FOOTER link is
      wired to a placeholder (tel:+012 (345) 556 99) "even though it displays
      the real number" — that "real" is the auditor's inference, not a
      confirmation. Number has not been dialled. A US +1-754 (Florida) number
      for a Jamaica-headquartered company is plausible for a nearshore BPO but
      worth confirming it is the line that should ring.
    verified: false

